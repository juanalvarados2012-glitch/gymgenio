<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img" aria-label="De pie y abajo en la sentadilla, visto de lado">
  <defs>
    <marker id="p" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#CCFF00"/>
    </marker>
  </defs>

  <line x1="14" y1="176" x2="326" y2="176" stroke="#8B8B95" stroke-width="1.5" opacity=".5"/>

  <!-- 1 · De pie -->
  <g stroke="#F3F3F1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="86" cy="46" r="12" fill="#F3F3F1" stroke="none"/>
    <line x1="86" y1="58" x2="86" y2="106"/>
    <line x1="86" y1="106" x2="88" y2="142"/>
    <line x1="88" y1="142" x2="88" y2="176"/>
    <line x1="86" y1="70" x2="104" y2="96"/>
    <line x1="88" y1="176" x2="104" y2="176" stroke-width="5"/>
  </g>

  <path d="M132 112 q28 16 52 0" stroke="#CCFF00" stroke-width="2.5" fill="none" marker-end="url(#p)"/>

  <!-- 2 · Abajo -->
  <g stroke="#F3F3F1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="228" cy="74" r="12" fill="#F3F3F1" stroke="none"/>
    <line x1="228" y1="86" x2="243" y2="128"/>
    <line x1="243" y1="128" x2="272" y2="140"/>
    <line x1="272" y1="140" x2="270" y2="176"/>
    <line x1="228" y1="96" x2="248" y2="104"/>
    <line x1="270" y1="176" x2="286" y2="176" stroke-width="5"/>
  </g>

  <!-- La línea que enseña: la espalda recta.
       Va separada del tronco y sobresale por los dos extremos, para que se lea
       como una regla apoyada en la espalda y no como parte del cuerpo. -->
  <line x1="211" y1="80" x2="234" y2="144" stroke="#CCFF00" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- La silla imaginaria en la que te sientas -->
  <path d="M290 140 h30 M320 140 v36" stroke="#8B8B95" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
</svg>
