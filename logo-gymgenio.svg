<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#8f77ff"/>
      <stop offset="55%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#4f34e0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9e3ff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a1a80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="500" height="500" rx="112" fill="url(#bg)"/>

  <!-- Destello mágico detrás -->
  <g opacity="0.9">
    <circle cx="250" cy="235" r="150" fill="#ffffff" opacity="0.06"/>
    <circle cx="250" cy="235" r="110" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- Mancuerna (dumbbell) -->
  <g filter="url(#soft)">
    <!-- barra -->
    <rect x="150" y="222" width="200" height="26" rx="13" fill="url(#metal)"/>
    <!-- pesa izquierda -->
    <rect x="120" y="188" width="34" height="94" rx="16" fill="url(#metal)"/>
    <rect x="98"  y="205" width="30" height="60" rx="14" fill="url(#metal)"/>
    <!-- pesa derecha -->
    <rect x="346" y="188" width="34" height="94" rx="16" fill="url(#metal)"/>
    <rect x="372" y="205" width="30" height="60" rx="14" fill="url(#metal)"/>
  </g>

  <!-- Chispas mágicas (genio) -->
  <g fill="#c6f135">
    <path d="M250 96 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
    <path d="M388 132 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity="0.95"/>
    <path d="M120 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="380" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1" fill="#ffffff">GymGenio</text>
  <text x="250" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#dcd4ff">ENTRENADOR IA</text>
</svg>
